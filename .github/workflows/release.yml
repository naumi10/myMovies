name: Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when you push a tag like v1.0.0

jobs:
  build-and-release:
    name: Build Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: myMovies.exe
            release_archive: myMovies-windows-x64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: myMovies
            release_archive: myMovies-linux-x64.tar.gz



    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Asset
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.release_archive }} ${{ matrix.artifact_name }}

      - name: Package Linux Asset
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Copy your linux icon file to the release directory before compressing
          cp assets/myMovies.png target/${{ matrix.target }}/release/ 
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.release_archive }} ${{ matrix.artifact_name }} myMovies.png

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_archive }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
