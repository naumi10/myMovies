[package]
name = "myMovies"
version = "0.1.0"
edition = "2024"
description = "A small desktop app for keeping track of a DVD and Blu-ray collection"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
    "default_fonts",
    "clipboard",
    "links",
] }
encoding_rs = "0.8"
rfd = "0.17"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = "2"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
resvg = { version = "0.49", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

[build-dependencies]
winres = "0.1"
